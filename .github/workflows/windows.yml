# Windows build: MSYS2 (UCRT64) with Qt 6 and GStreamer, packaged as a self-contained folder
# and tested on its own. Every push uploads the zip as a build artifact; a version tag
# (v2.7.0, ...) also publishes it as a GitHub Release.
name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p
            qt6-base:p qt6-tools:p
            gstreamer:p gst-plugins-base:p gst-plugins-good:p gst-plugins-bad:p gst-plugins-ugly:p gst-libav:p
            glib-networking:p SDL2:p
            mesa:p gdb:p python:p python-pillow:p python-numpy:p

      - name: Build
        run: |
          set +e -o pipefail
          { cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build; } 2>&1 | tee build.log \
            || { bash packaging/windows/ci-annotate.sh error Build build.log; tail -60 build.log | bash packaging/windows/ci-annotate.sh error "Build (end of log)" - '.'; exit 1; }

      - name: Unit tests
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log || { bash packaging/windows/ci-annotate.sh error "Unit tests" ctest.log; exit 1; }
          bash packaging/windows/ci-annotate.sh notice "Unit tests" ctest.log 'tests passed|PASS'

      - name: Package
        run: |
          VERSION=$(sed -n 's/^project(CRTPlayer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          set -o pipefail
          bash packaging/windows/package.sh build "dist/CRT Player" 2>&1 | tee package.log \
            || { bash packaging/windows/ci-annotate.sh error Package package.log '.'; exit 1; }
          bash packaging/windows/ci-annotate.sh notice Package package.log 'Packaged|GStreamer plugins'
          cp README.md "dist/CRT Player/README.md"
          # The download gets a stripped player; the smoke test keeps the symbols for backtraces.
          rm -rf zipdir && mkdir zipdir && cp -r "dist/CRT Player" zipdir/
          strip "zipdir/CRT Player/crtplayer.exe"
          (cd zipdir && zip -qr "../CRT_Player-$VERSION-windows-x64.zip" "CRT Player")
          echo "::notice title=Download::$(ls -la CRT_Player-*.zip | awk '{printf "%s %.0f MB", $NF, $5/1048576}'), crtplayer.exe $(du -h "zipdir/CRT Player/crtplayer.exe" | cut -f1)"

      - name: Smoke test (the packaged player on its own)
        run: |
          set +e -o pipefail   # finish reporting even when the test fails
          bash packaging/windows/smoke-test.sh "dist/CRT Player" smoke 2>&1 | tee smoke.log
          rc=$?
          bash packaging/windows/ci-annotate.sh notice "Smoke test" smoke.log 'PASS|rc=|CRTPlayer|checks passed|software OpenGL|mesa package'
          sed -n '/---- the player/,/---- under the debugger/p' smoke.log | head -150 | bash packaging/windows/ci-annotate.sh warning "Player output" - '.'
          sed -n '/---- under the debugger/,$p' smoke.log | head -120 | bash packaging/windows/ci-annotate.sh warning "Debugger" - '.'
          grep '^ON-SCREEN' smoke.log | sed 's/^ON-SCREEN //' | bash packaging/windows/ci-annotate.sh notice "On the screen" - '.'
          grep -v '^WEB ' smoke.log | bash packaging/windows/ci-annotate.sh error "Smoke test" - 'FAIL|failed|rror'
          grep '^WEB FAIL' smoke.log | bash packaging/windows/ci-annotate.sh error "Videos from web sites" - '.'
          exit $rc

      # (a step of its own: GitHub shows ten annotations a step)
      - name: Videos from web sites (what the smoke test found)
        if: always()
        run: |
          grep '^WEB \|^web-video run' smoke.log | sed 's/^WEB //' | bash packaging/windows/ci-annotate.sh notice "Videos from web sites" - '.' || true

      - name: Upload the smoke test's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: smoke/out
          if-no-files-found: ignore

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CRT_Player-${{ env.VERSION }}-windows-x64
          path: CRT_Player-*-windows-x64.zip

      # A new version number on main (or a pushed v* tag) publishes a release with the zip.
      - name: Is this version released yet?
        id: released
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=yes" >> "$GITHUB_OUTPUT"
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.released.outputs.exists == 'no'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: CRT Player ${{ env.VERSION }}
          prerelease: true
          body: |
            **Windows 10 and 11 (preview):** download `CRT_Player-${{ env.VERSION }}-windows-x64.zip`, unzip it anywhere and run `crtplayer.exe` in the `CRT Player` folder. Nothing else to install.
            Windows may warn about an unrecognised app the first time: choose *More info → Run anyway* (the build isn't code-signed).
            Linux: use the AppImage. See the README for details.
          files: CRT_Player-*-windows-x64.zip
